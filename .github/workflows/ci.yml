name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The Release workflow runs this whole pipeline first and publishes only if it passes.
  workflow_call:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

# One run at a time on the self-hosted Mac; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Pull requests from forks: only in a public repository, so only on GitHub's hosted runners, never
    # the self-hosted Mac. `pull_request` gives them no secrets and a read-only token, and first-time
    # contributors' runs wait for a maintainer's approval (repository setting).
    #
    # The "Release vX.Y.Z" commit that scripts/release.sh pushes to main is skipped here: its tag starts
    # the Release workflow, which runs this pipeline itself (there github.ref is the tag, not main).
    if: >-
      (github.event_name != 'pull_request'
        || github.event.pull_request.head.repo.full_name == github.repository
        || !github.event.repository.private)
      && !(github.event_name == 'push' && github.ref == 'refs/heads/main'
        && startsWith(github.event.head_commit.message, 'Release v'))
    # Private repository: the maintainer's self-hosted Mac. Public repository: GitHub's free
    # hosted macOS runner. Self-hosted runners must never serve a public repository.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted","macOS","ARM64"]') || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install Claude Code CLI (hosted runners only; used by contract tests, no account needed)
        if: runner.environment == 'github-hosted'
        run: npm install -g @anthropic-ai/claude-code
      - name: Toolchain
        run: |
          swift --version
          command -v claude && claude --version || echo "claude CLI not found: contract tests will be skipped"
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Bundle app (ad-hoc signed)
        run: ./scripts/bundle-app.sh
      - name: UI smoke test (renders every screen and sheet off-screen)
        run: ./scripts/ui-smoke-test.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Diorama-app
          path: dist/Diorama-*.zip
          retention-days: 7
