name: Release

# Publishes Diorama.app as a GitHub Release.
#   - Push a tag `vX.Y.Z` (use scripts/release.sh) → build, test, package, publish.
#   - Run manually (workflow_dispatch) → same pipeline, published as a draft by default.
# Signing: if the Developer ID secrets below are set, the app is signed with the hardened
# runtime and notarized; otherwise it is ad-hoc signed and the notes say so.
#   DEVELOPER_ID_P12_BASE64, DEVELOPER_ID_P12_PASSWORD, DEVELOPER_ID_IDENTITY
#   NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (app-specific password)
# Optional repository variable: BUNDLE_ID (default io.github.diorama.Diorama).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'io.github.diorama.Diorama' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          SOURCE_VERSION="$(sed -n 's/.*public static let current = "\(.*\)".*/\1/p' Sources/DioramaCore/Models.swift)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [[ "$TAG_VERSION" != "$SOURCE_VERSION" ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match DioramaVersion.current ($SOURCE_VERSION). Use scripts/release.sh."
              exit 1
            fi
          fi
          echo "version=$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$SOURCE_VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$SOURCE_VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${{ inputs.draft }}" == "true" ]]; then echo "draft=true" >> "$GITHUB_OUTPUT"; else echo "draft=false" >> "$GITHUB_OUTPUT"; fi
          echo "Releasing $SOURCE_VERSION"

      - name: Test
        run: swift test

      - name: Import Developer ID certificate
        id: signing
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.DEVELOPER_ID_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "${P12}" || -z "${IDENTITY}" ]]; then
            echo "No signing secrets: building an ad-hoc signed app."
            echo "identity=-" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/diorama-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Build and package
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: ./scripts/bundle-app.sh

      - name: Notarize
        if: steps.signing.outputs.identity != '-'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${APPLE_ID}" || -z "${TEAM_ID}" || -z "${NOTARY_PASSWORD}" ]]; then
            echo "::warning::Signed but not notarized: notarization secrets are missing."
            exit 0
          fi
          xcrun notarytool submit "dist/Diorama-$VERSION.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple dist/Diorama.app
          rm -f "dist/Diorama-$VERSION.zip"
          (cd dist && ditto -c -k --keepParent Diorama.app "Diorama-$VERSION.zip")
          (cd dist && shasum -a 256 "Diorama-$VERSION.zip" > "Diorama-$VERSION.zip.sha256")

      - name: Release notes and Homebrew cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.identity != '-' }}
        run: ./scripts/release-notes.sh "$VERSION" "$SIGNED" > dist/release-notes.md

      - name: Publish GitHub Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DRAFT: ${{ steps.version.outputs.draft }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          ASSETS=("dist/Diorama-$VERSION.zip" "dist/Diorama-$VERSION.zip.sha256" "dist/diorama.rb")
          FLAGS=(--title "Diorama $VERSION" --notes-file dist/release-notes.md)
          [[ "$PRERELEASE" == "true" ]] && FLAGS+=(--prerelease)
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Re-running, or publishing a draft made earlier by a manual run.
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" "${FLAGS[@]}" --draft="$DRAFT"
          elif [[ "$DRAFT" == "true" ]]; then
            gh release create "$TAG" "${ASSETS[@]}" "${FLAGS[@]}" --draft --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "${ASSETS[@]}" "${FLAGS[@]}" --target "$GITHUB_SHA"
          fi
          echo "### Diorama $VERSION $( [[ $DRAFT == true ]] && echo '(draft)' )" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY" || true

      - name: Clean up signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
